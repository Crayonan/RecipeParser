<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RecipeParser</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0d0d'/%3E%3Cpath d='M10 22V10h7a4 4 0 0 1 0 8h-7m6 0 5 4' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark">R</span>
        <span class="brand-name">RecipeParser</span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-title" id="topbar-title"></div>
        <div class="topbar-actions">
          <span class="conn" id="conn" title="Live connection to the server"></span>
          <button class="icon-btn" id="bell" title="Notifications"></button>
          <a class="btn btn-primary btn-sm" href="#/new">New run</a>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden></aside>
  <div class="toasts" id="toasts"></div>
  <div class="notif-panel" id="notif-panel" hidden></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
